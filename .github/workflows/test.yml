name: Jest Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [24.x]

    steps:
    - uses: actions/checkout@v4

    - name: Setup NodeJS
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}

    - name: Install
      run: npm ci

    - name: Type check
      run: npx tsc --noEmit -p .

    - name: Type check tests
      run: npx tsc --noEmit -p test

    - name: Lint
      run: npm run lint

    - name: Test
      run: |
        npm run test