<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>
        Plot Types
    </title>

    <link href="./css/styles.css" rel="stylesheet">
    <link href="../dist/main.css" rel="stylesheet">

    <script src="../dist/ocharts.js"></script>
</head>

<body>
<div></div>
</body>

<script>
    const points = values => values.map((y, x) => ({ x: x, y: y }))

    const chart = OCharts.chart(
        document.querySelector('div'),
        {
            type: 0,
            title: 'Plot Types',
            enableTooltip: true,
            enableLegend: true,
            data: {
                xType: 0,
                xTitle: 'X',
                yTitle: 'Y',
                values: [
                    {
                        type: 0,
                        label: 'Line',
                        width: 2,
                        values: points([12, 18, 15, 24, 20, 28, 26])
                    },
                    {
                        type: 0,
                        label: 'Dashed Line',
                        width: 2,
                        dash: '[15,5]',
                        values: points([8, 10, 14, 12, 16, 15, 19])
                    },
                    {
                        type: 1,
                        label: 'Attention Line',
                        width: 2,
                        values: points([22])
                    },
                    {
                        type: 2,
                        label: 'Column',
                        values: points([10, 14, 9, 16, 12, 18, 15])
                    },
                    {
                        type: 3,
                        label: 'Bar',
                        values: points([6, 9, 7, 11, 8, 10, 12])
                    },
                    {
                        type: 4,
                        label: 'Stacking Column A',
                        values: points([4, 6, 5, 7, 6, 8, 7])
                    },
                    {
                        type: 4,
                        label: 'Stacking Column B',
                        values: points([3, 4, 6, 3, 5, 4, 6])
                    }
                ]
            }
        }
    )

    chart.render()
</script>
</html>
