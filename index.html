<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sandbox</title>

    <link rel="stylesheet" href="./example/css/sandbox.css">
    <link rel="stylesheet" href="./dist/main.css">

    <script src="./dist/ocharts.js"></script>
</head>

<body>
    <div class="base">
        <header class="toolbar">
            <h1><img src="./logo.svg" alt="">Sandbox</h1>

            <label class="toolbar-seed">
                Seed

                <input type="number" id="seed" oninput="initRNG(); refresh()"/>
            </label>

            <div class="toolbar-actions">
                <button onclick="saveCookiesToClipboard()">
                    Save to clipboard
                </button>

                <button onclick="loadCookiesByWindow()">
                    Load
                </button>
            </div>
        </header>

        <div class="preview">
            <div class="chart-container">
                <div id="chart"></div>
            </div>

            <div class="examples"></div>
        </div>

        <div class="settings"></div>
    </div>
</body>

<template id="custom-tooltip-template">
    <div style="display: flex; flex-direction: column; gap: 8px; padding: 8px; border: 1px solid black; border-radius: 4px; background-color: #ffffff">
        <img src="https://placecats.com/${ Id }/${ Id }" alt="cat" width="120" height="120"/>

        <span>
            ${ Id }, ${ Name }
        </span>

        <b>
            ${ Value }
        </b>
    </div>
</template>

<script>
    let rng,
        chart

    class RNG {
        m = 0x80000000

        a = 1103515245

        c = 12345

        constructor(seed) {
            this.state = seed || Math.floor(Math.random() * (this.m - 1))
        }

        nextInt() {
            this.state = (this.a * this.state + this.c) % this.m

            return this.state
        }

        nextFloat() {
            return this.nextInt() / (this.m - 1)
        }
    }

    function inputValue(id) {
        return document.getElementById(id).value
    }

    function inputNumber(id) {
        return +inputValue(id)
    }

    function isChecked(id) {
        return document.getElementById(id).checked
    }

    function initRNG() {
        rng = new RNG(inputNumber('seed'))
    }

    function setCookie(name, value, days) {
        const expires = days ? '; expires=' + new Date(Date.now() + days * 24 * 60 * 60 * 1000).toUTCString() : ''

        document.cookie = name + '=' + (value || '') + expires + '; path=/'
    }

    function getCookie(name) {
        const cookie = document.cookie
            .split(';')
            .map(part => part.trimStart())
            .find(part => part.startsWith(name + '='))

        return cookie ? cookie.substring(name.length + 1) : null
    }

    function saveState() {
        const state = {}

        for (const input of document.querySelectorAll('input, select'))
            state[input.id] = input.type === 'checkbox' ? input.checked : input.value

        setCookie('state', JSON.stringify(state), 365)
    }

    function restoreState() {
        const savedState = getCookie('state')

        if (!savedState) {
            document.getElementById('seed').value = 123
            initRNG()

            return
        }

        for (const [id, value] of Object.entries(JSON.parse(savedState))) {
            const element = document.getElementById(id)

            if (!element)
                continue

            if (element.type === 'checkbox')
                element.checked = value
            else if (element.tagName !== 'SELECT' || [...element.options].some(option => option.value === value))
                element.value = value
        }

        initRNG()
    }

    function saveCookiesToClipboard() {
        navigator.clipboard.writeText(getCookie('state'))
    }

    function loadCookiesByWindow() {
        navigator.clipboard.readText().then(text => {
            const input = prompt('Cookies', text)

            if (input) {
                setCookie('state', input)

                location.reload()
            }
        })
    }

    function getColor() {
        const color = `#${Math.floor(rng.nextFloat() * 16777215).toString(16).padStart(6, '0')}`

        // random value is taken anyway, so other generated values don't change when color mode is switched
        return inputNumber('color-mode') === 0 ? color : undefined
    }

    function getData(index) {
        return {
            Id: 50,
            Name: 'First Second ' + index,
            Value: 16
        }
    }

    function addDays(days) {
        const result = new Date('2025-10-11T08:00:00.000Z')

        result.setDate(result.getDate() + days)

        return result
    }

    function getValues(type, count, valuesType, pointsCount, plotType) {
        const values = [],
            seriesWidth = inputNumber('series-width'),
            customLabel = inputValue('custom-label'),
            indexedCustomLabel = isChecked('indexed-custom-label'),
            isCustomLabel = customLabel.trim().length !== 0,
            enableNegativeValuesInPlot = isChecked('negative-values-in-plot'),
            lineType = inputValue('line-type'),
            lineDrawMode = isChecked('smooth-line') ? 1 : 0,
            baseValue = inputValue('base-value')

        function getLabel(prefix, index) {
            if (!isCustomLabel)
                return `${prefix} ${index}`

            return indexedCustomLabel ? customLabel + ` ${index}` : customLabel
        }

        function pickValue(ascendingValue, sameValue) {
            switch (valuesType) {
                case 0:
                    return rng.nextFloat() * baseValue

                case 1:
                    return ascendingValue

                case 2:
                    return sameValue

                default:
                    return 0
            }
        }

        switch (type) {
            case 0: {
                const xType = inputNumber('x-axis-type'),
                    negativeShift = valuesType === 0 && enableNegativeValuesInPlot ? baseValue / 2 : 0

                for (let i = 0; i < count; i++) {
                    const points = [],
                        sameValue = rng.nextFloat() * baseValue

                    for (let j = 0; j < pointsCount; j++) {
                        const x = xType === 1 ? addDays(j).toISOString() : j

                        if (plotType === 1) {
                            points.push({ x, y: sameValue })

                            break
                        }

                        points.push({
                            x,
                            y: pickValue(j, sameValue) - negativeShift,
                            data: getData(j + i)
                        })
                    }

                    values.push({
                        type: plotType,
                        values: points,
                        width: seriesWidth,
                        label: getLabel('Series', i),
                        data: getData(i),
                        dash: JSON.parse(lineType),
                        drawMode: lineDrawMode,
                        color: getColor()
                    })
                }

                break
            }

            case 1:
            case 4: {
                const sameValue = rng.nextFloat() * baseValue

                for (let i = 0; i < count; i++)
                    values.push({
                        value: pickValue(i, sameValue),
                        label: getLabel(type === 1 ? 'Sector' : 'Part', i),
                        data: getData(i),
                        color: getColor()
                    })

                break
            }

            case 2: {
                const sameValue = rng.nextFloat() * baseValue

                for (let i = 0; i < count; i++)
                    values.push({
                        value: pickValue(50, sameValue),
                        label: isCustomLabel ? customLabel : `Label ${i}`,
                        data: getData(i),
                        color: getColor()
                    })

                break
            }

            case 3: {
                const sameValue = rng.nextFloat() * baseValue,
                    sectorsCount = inputNumber('tree-sectors-count')

                for (let i = 0; i < count; i++) {
                    const sectors = Array.from({ length: sectorsCount }, (_, j) => ({
                        value: pickValue(j, sameValue),
                        label: getLabel('Cell', j),
                        data: getData(j)
                    }))

                    values.push({
                        label: `Group ${i}`,
                        sectors,
                        data: getData(i),
                        color: getColor()
                    })
                }

                break
            }

            case 5: {
                const getRow = (label, level) => {
                    const value = valuesType === 1 ? level + 1 : rng.nextFloat() * baseValue,
                        children = level < 2
                            ? Array.from({ length: 1 + Math.floor(rng.nextFloat() * 3) }, (_, i) => getRow(`${ label }.${ i }`, level + 1))
                            : undefined

                    return {
                        label: `Row ${ label }`,
                        subLabel: level > 0 ? `Code ${ label }` : undefined,
                        parts: [
                            { value: value * .7, label: 'First', data: getData(level) },
                            { value: value * .3, label: 'Second', color: getColor() }
                        ],
                        barLabel: Math.round(value).toString(),
                        cells: { value: Math.round(value), level },
                        children
                    }
                }

                for (let i = 0; i < count; i++)
                    values.push(getRow(i, 0))

                break
            }

            default:
                break
        }

        return values
    }

    function getContextMenu() {
        return [
            {
                text: 'Button 1',
                action: data => {
                    console.log('Button 1 action', data)
                }
            },
            {
                text: 'Button 2',
                action: () => {
                    console.log('Another action')
                }
            }
        ]
    }

    function getStops(values, isPercent) {
        const total = values.reduce((acc, value) => acc + value.value, 0)

        return Array.from({ length: inputNumber('stops-count') }, (_, i) => ({
            label: `Stop ${i}`,
            value: isPercent ? +(rng.nextFloat() * 100).toFixed(1) : rng.nextFloat() * total,
            color: getColor()
        }))
    }

    function getPercentParts(values) {
        const total = values.reduce((acc, value) => acc + value.value, 0),
            filled = rng.nextFloat() * 100

        return values.map(value => ({ ...value, value: +(value.value / total * filled).toFixed(1) }))
    }

    function refresh() {
        initRNG()

        const customTooltipEnabled = isChecked('custom-tooltip'),
            type = inputNumber('chart-type'),
            chartsCount = Math.max(inputNumber('charts-count'), 1),
            typesCount = document.getElementById('chart-type').options.length

        function chartData(chartType) {
            const values = getValues(
                    chartType,
                    inputNumber('values-count'),
                    inputNumber('values-type'),
                    inputNumber('points-count'),
                    inputNumber('plot-type')
                ),
                isPercent = chartType === 4 && isChecked('percentage-mode')

            return {
                values: isPercent ? getPercentParts(values) : values,
                stops: chartType === 4 ? getStops(values, isPercent) : undefined,
                columns: chartType === 5 ? [{ key: 'value', title: 'Value' }, { key: 'level', title: 'Level' }] : undefined,
                percentageMode: isPercent,
                leftLabel: inputValue('left-label'),
                rightLabel: inputValue('right-label'),
                xTitle: isChecked('x-axis-label') ? 'X-axis title' : null,
                yTitle: isChecked('y-axis-label') ? 'Y-axis title' : null,
                xType: inputNumber('x-axis-type'),
                xScale: inputNumber('x-scale'),
                yScale: inputNumber('y-scale'),
                min: inputNumber('gauge-min'),
                max: inputNumber('gauge-max'),
                enableTrack: isChecked('use-track'),
                disableStepLabels: isChecked('disable-step-labels'),
                padding: inputNumber('tree-padding'),
                gap: inputNumber('tree-gap'),
                innerRadius: inputNumber('inner-radius'),
                simple: isChecked('simple'),
                innerTitle: inputValue('inner-title'),
                shortLabels: isChecked('short-labels'),
                yMax: inputValue('y-max')
            }
        }

        const charts = chartsCount > 1
            ? Array.from({ length: chartsCount }, (_, i) => {
                const chartType = (type + i) % typesCount

                return { type: chartType, title: `Chart ${i + 1}`, data: chartData(chartType) }
            })
            : undefined

        const settings = {
            title: isChecked('title') ? 'Title' : null,
            enableTooltip: isChecked('tooltip') || customTooltipEnabled,
            enableLegend: isChecked('legend'),
            enableOther: isChecked('other'),
            staticMode: isChecked('static-mode'),
            data: charts ? undefined : chartData(type),
            charts,
            columns: inputNumber('columns') || undefined,
            type,
            baseColor: inputNumber('color-mode') === 2 ? inputValue('base-color') : null,
            templateId: customTooltipEnabled ? 'custom-tooltip-template' : null,
            contextMenu: isChecked('context-menu') ? getContextMenu() : null,
            valuePostfix: inputValue('postfix'),
            isDarkThemeFunction: isDarkTheme,
            enableDebugMode: isChecked('debug-mode'),
            enableMove: isChecked('move')
        }

        applyPageTheme()
        showChartTypeSettings(type, chartsCount)
        highlightAppliedExamples()
        updateSettingsFade()

        if (chart === undefined)
            chart = OCharts.chart(document.getElementById('chart'), settings)
        else
            chart.applySettings(settings)

        saveState()
    }

    function setWidth() {
        document.getElementById('chart').style.width = inputValue('width') + '%'

        saveState()
    }

    function setHeight() {
        document.getElementById('chart').style.height = inputValue('height') + '%'

        saveState()
    }
</script>

<script src="./example/js/sandbox-theme.js"></script>
<script src="./example/js/sandbox-settings.js"></script>
<script src="./example/js/sandbox-examples.js"></script>
<script src="./example/js/sandbox-effects.js"></script>

<script>
    restoreState()

    refresh()

    setWidth()
    setHeight()
</script>
</html>
